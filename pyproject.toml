[project]
name = "ai-tasks"
version = "0.1.0"
description = "Small LLM experiments: OpenAI, Gemini, Ollama, web scraping and multi-agent chat."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.30.0",
    "huggingface-hub>=1.33.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "litellm>=1.106.0",
    "mcp>=2.3.0",
    "openai>=2.54.0",
    "playwright>=1.64.0",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "trafilatura>=2.3.1",
]
